name: Sonda de fontes (temporário)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests openpyxl

      - name: Sondar endpoints
        env:
          USDA_FAS_KEY: ${{ secrets.USDA_FAS_KEY }}
        run: python scripts/probe_sources.py
